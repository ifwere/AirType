name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      # Keep any compilation performed during the build compatible with old macOS.
      # arm64 cannot target anything older than 11.0.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.arch == 'arm64' && '11.0' || '10.13' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 (Apple Silicon)
          - runner: macos-15
            arch: arm64
            pyi_arch: arm64
          # x86_64 (Intel); macos-13 was retired on 2025-12-04
          - runner: macos-15-intel
            arch: x86_64
            pyi_arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate icon
        run: python src/generate_icon.py

      - name: Build app with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --clean \
            --name "AirType" \
            --icon "icon.icns" \
            --add-data "icon.png:." \
            --osx-bundle-identifier "com.run.airtype" \
            --target-arch "${{ matrix.pyi_arch }}" \
            src/remote_server.py

      - name: Write bundle version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          if echo "${VERSION}" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            BUNDLE_VERSION="${VERSION}"
          else
            BUNDLE_VERSION="0.0.0"
          fi
          PLIST="dist/AirType.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${BUNDLE_VERSION}" "${PLIST}" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${BUNDLE_VERSION}" "${PLIST}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUNDLE_VERSION}" "${PLIST}" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUNDLE_VERSION}" "${PLIST}"
          echo "APP_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Verify macOS 12 compatibility
        run: ./scripts/verify_bundle.sh dist/AirType.app "${{ matrix.arch }}" 12.0

      - name: Ad-hoc codesign
        run: codesign --deep --force --verbose --sign "-" dist/AirType.app

      - name: Package
        run: |
          NAME="AirType-${APP_VERSION}-${{ matrix.arch }}"
          ditto -c -k --sequesterRsrc --keepParent dist/AirType.app "${NAME}.zip"
          shasum -a 256 "${NAME}.zip" > "${NAME}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirType-${{ matrix.arch }}
          path: |
            AirType-*.zip
            AirType-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            macOS 12 (Monterey) 及以上可用。每个压缩包附有对应的 .sha256 校验文件。

            | 文件 | 架构 | 适用机型 |
            | --- | --- | --- |
            | AirType-*-x86_64.zip | x86_64 | Intel Mac |
            | AirType-*-arm64.zip | arm64 | Apple Silicon (M 系列) |

            应用使用 ad-hoc 签名，未经过 Apple 公证。首次打开请在 Finder 中右键点击 App 选择“打开”，或执行：

            ```
            xattr -d com.apple.quarantine /Applications/AirType.app
            ```

            首次使用还需在「系统设置 - 隐私与安全性 - 辅助功能」中允许 AirType，否则文字不会粘贴到目标窗口。
