name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 (Apple Silicon)
          - runner: macos-15
            arch: arm64
          # x86_64 (Intel); macos-13 was retired on 2025-12-04
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate icon
        run: python src/generate_icon.py

      - name: Build app with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --clean \
            --name "AirType" \
            --icon "icon.icns" \
            --add-data "icon.png:." \
            --osx-bundle-identifier "com.run.airtype" \
            src/remote_server.py

      - name: Ad-hoc codesign
        run: codesign --deep --force --verbose --sign "-" dist/AirType.app

      - name: Package
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          NAME="AirType-${VERSION}-${{ matrix.arch }}"
          ditto -c -k --sequesterRsrc --keepParent dist/AirType.app "${NAME}.zip"
          shasum -a 256 "${NAME}.zip" > "${NAME}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirType-${{ matrix.arch }}
          path: |
            AirType-*.zip
            AirType-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
